name: CI - Checks

# Runs on every pull request to main or dev (and again when its labels change).
# - checks: lint, compile and pipeline validation. Can be made mandatory before merging
#   (Settings -> Rules -> Rulesets -> Require status checks: "checks").
# - release-preview: on PRs to main only, comments which release merging it will create.

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install project dependencies and check they are consistent
      - name: Install dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
          python -m pip check

      # 4. Lint: syntax errors and undefined names only
      - name: Lint with Ruff
        id: lint
        run: ruff check src --select E9,F63,F7,F82 --output-format=github

      # 5. Make sure every source file compiles
      - name: Compile Python sources
        id: compile
        run: python -m compileall -q src

      # 6. Validate the DVC pipeline definition (dvc.yaml + params.yaml)
      - name: Validate DVC pipeline
        id: dvc
        run: dvc dag

      # 7. Summary table shown at the top of the workflow run (always, even if a check failed)
      - name: Write summary
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          LINT: ${{ steps.lint.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          DVC: ${{ steps.dvc.outcome }}
        run: |
          {
            echo "## CI checks"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Dependencies (\`pip check\`) | ${DEPS} |"
            echo "| Lint (\`ruff\`: syntax errors, undefined names) | ${LINT} |"
            echo "| Compile sources (\`src/\`) | ${COMPILE} |"
            echo "| DVC pipeline (\`dvc dag\`) | ${DVC} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-preview:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1. Download source code (for the shared version script)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Compute the version this PR would release and comment it on the PR.
      #    The same comment is updated on every run instead of adding a new one.
      - name: Comment release preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          read -r BUMP LAST VERSION <<< "$(bash .github/scripts/next_version.sh "$LABELS")"

          if [ -n "$VERSION" ]; then
            BODY="**Release preview**

          Merging this pull request will publish **${VERSION}** (${BUMP} bump from ${LAST}):
          the Docker image will be tagged \`${VERSION}\` and \`latest\`, and a GitHub release will be created."
          else
            BODY="**Release preview**

          No \`release:*\` label: merging this pull request will **not** create a release
          (the Docker image is only tagged with the commit SHA).
          Add \`release:major\`, \`release:minor\` or \`release:patch\` to create one."
          fi

          echo "$BODY"
          # Edit the previous preview comment, or create it the first time
          gh pr comment "$PR_NUMBER" --edit-last --body "$BODY" 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body "$BODY"
