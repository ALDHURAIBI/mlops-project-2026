
name: MLOps - Build and Publish Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: mlops-arwa-fall2026
      REGION: europe-west6
      REPOSITORY: mlops-intrusion
      IMAGE_NAME: network-intrusion-service

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # 4. Authenticate securely to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mlops-arwa-fall2026
          workload_identity_provider: projects/704937435550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: google-service-account@mlops-arwa-fall2026.iam.gserviceaccount.com

      # 5. Install Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # 6. Download DVC-tracked model artifacts
      - name: Restore DVC artifacts
        run: |
          dvc pull
          ls -lh models/

      # 7. Restore the registered BentoML model
      - name: Import BentoML model
        run: |
          bentoml models import models/network_intrusion_classifier.bentomodel
          python - <<'PY'
          import json
          import bentoml

          with open("models/model_info.json") as f:
              info = json.load(f)

          model = bentoml.models.get(info["bentoml_model_tag"])
          print("Restored model:", model.tag)
          PY

      # 8. Build the BentoML service
      - name: Build BentoML artifact
        run: |
          bentoml build src
          bentoml list

      # 9. Configure Docker authentication
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            europe-west6-docker.pkg.dev --quiet

      # 10. Build Docker image for AMD64
      - name: Build Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          bentoml containerize network_intrusion_service:latest \
            --platform linux/amd64 \
            --image-tag "$IMAGE_URI"

          docker image inspect "$IMAGE_URI" \
            --format '{{.Os}}/{{.Architecture}}'

      # 11. Publish the image
      - name: Push image to Artifact Registry
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "$IMAGE_URI"
          echo "Published image: $IMAGE_URI"
